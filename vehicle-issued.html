.tabs{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:3px;gap:3px}
.tabs button{background:none;border:0;color:#C9D1E6;height:38px;padding:0 16px;border-radius:8px;font-weight:800}
.tabs button[aria-selected="true"]{background:var(--gold);color:#13214B}
.navlink{color:#C9D1E6;font-weight:700;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:8px;height:44px;display:inline-flex;align-items:center;padding:0 12px}
.navlink:hover{color:#fff;background:rgba(255,255,255,.07)}

main{padding-top:16px;padding-bottom:120px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-head{background:var(--head);color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--gold)}
.card-head h2{margin:0;font-size:17px;font-weight:800}
.card-head .no{background:var(--gold);color:#13214B;font-weight:900;border-radius:999px;padding:2px 12px;font-size:14px}
form{padding:14px 16px 18px;display:grid;gap:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field label,.lab{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:0 12px;width:100%;min-width:0}
.field textarea{height:96px;padding:10px 12px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
.big{font-size:19px !important;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.mini{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-weight:800;font-size:13px;white-space:nowrap}
.mini:hover{background:var(--surface2)}
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg2 button{border:0;background:var(--surface2);height:42px;padding:0 12px;font-weight:800;font-size:13px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--head);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--head);color:#fff;border-color:var(--head)}
.hint{font-size:13px;font-weight:600;color:var(--ok)}
.hint.warn{color:var(--warn)}
.section-t{font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--band);padding-bottom:4px;margin-top:4px}

/* paper preview */
.preview-wrap{position:sticky;top:16px}
.preview-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase}
.sheet{background:#fff;color:#16213E;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(19,33,75,.12);aspect-ratio:210/297;padding:4.8% 4.8% 3%;position:relative;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column}
.sheet *{font-family:Helvetica,Arial,sans-serif}
.sheet .wm{position:absolute;left:50%;top:52%;width:57%;transform:translate(-50%,-50%);opacity:.08;pointer-events:none}
.sheet .lh{width:100%;display:block}
.sheet .tbar{margin-top:1.6cqw;background:#13214B;color:#fff;border-radius:1cqw;display:flex;justify-content:space-between;align-items:center;padding:1.6cqw 2.2cqw;font-weight:700}
.sheet .tbar b{font-size:3.3cqw;letter-spacing:.2cqw}
.sheet .tbar span{color:#E8A317;font-size:2.4cqw}
.sheet .pgrid{display:grid;grid-template-columns:1fr 1fr;margin-top:2.4cqw;border:.25cqw solid #BDBDBD;border-right:0;border-bottom:0;position:relative}
.sheet .pc{border-right:.25cqw solid #BDBDBD;border-bottom:.25cqw solid #BDBDBD;min-height:8.6cqw}
.sheet .pc i{display:block;font-style:normal;background:#F3E2AE;color:#13214B;font-weight:700;font-size:1.75cqw;padding:.6cqw 1.4cqw}
.sheet .pc em{display:block;font-style:normal;font-weight:700;font-size:2.4cqw;padding:1cqw 1.4cqw;min-height:4.4cqw;overflow-wrap:anywhere}
.sheet .prem{border:.25cqw solid #BDBDBD;border-top:0;position:relative}
.sheet .prem em{font-weight:400;font-size:2.2cqw;white-space:pre-wrap;min-height:16cqw}
.sheet .sig{margin-top:auto;display:flex;justify-content:space-between;padding:0 1cqw 2cqw}
.sheet .sig>div{width:40%;text-align:center;font-size:1.9cqw;font-weight:700}
.sheet .sig .nm{font-size:2.1cqw;min-height:3cqw;font-weight:700}
.sheet .sig .ln{border-top:.25cqw solid #777;padding-top:.8cqw;margin-top:.6cqw}
.sheet .foot{display:flex;justify-content:space-between;font-size:1.5cqw;color:#888;border-top:.2cqw solid #E2E2E2;padding-top:.8cqw}

/* history */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px 0 38px}
.search svg{position:absolute;left:11px;top:12px;width:20px;height:20px;color:var(--muted)}
.hist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:110px 120px minmax(120px,1fr) minmax(120px,1fr) 140px auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.hrow:nth-child(even){background:color-mix(in srgb,var(--surface2) 70%,transparent)}
.hrow.hh{background:var(--band) !important;color:var(--band-ink);font-weight:900;font-size:12.5px;text-transform:uppercase;padding:8px 16px}
.hrow .no{font-weight:900;color:var(--accent)}
.hrow .pl{font-weight:900;font-size:16px}
.hrow small{display:block;color:var(--muted);font-size:12.5px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.icon{height:38px;min-width:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);padding:0 10px;font-weight:800;font-size:13px}
.icon:hover{background:var(--surface2)}
.icon svg{width:17px;height:17px}
.icon.del{color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:20px}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:1360px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.actionbar .status{margin-right:auto;color:var(--muted);font-size:13px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;height:48px;padding:0 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#13214B}
.btn.navy{background:var(--head);border-color:var(--head);color:#fff}
.btn svg{width:19px;height:19px}
.btn:disabled{opacity:.6;cursor:wait}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--gold);font-weight:900;padding:4px}

@media (max-width: 980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .preview-wrap{position:static}
  .sheet{max-width:560px;margin:0 auto}
}
@media (max-width: 700px){
  .wrap{padding:0 10px}
  .letterhead .paper{padding:6px 8px;border-radius:10px}
  .bar{padding:12px 14px;gap:10px}
  .brand h1{font-size:16px}
  .tabs{width:100%}
  .tabs button{flex:1}
  .navlink{display:none}
  main{padding-top:12px}
  .grid2{grid-template-columns:1fr 1fr;gap:10px}
  .hrow{grid-template-columns:1fr auto;grid-template-areas:"no acts" "pl acts" "dr dr" "dt dt";gap:2px 10px}
  .hrow.hh{display:none}
  .hrow .no{grid-area:no}.hrow .pl{grid-area:pl}.hrow .dr{grid-area:dr}.hrow .st{display:none}.hrow .dt{grid-area:dt}.hrow .acts{grid-area:acts}
  .hrow .icon .t{display:none}
  .actionbar{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .actionbar .status{display:none}
  .actionbar .btn{flex:1;padding:0 10px;font-size:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const dmy=s=>{if(!s)return "";const [y,m,d]=s.split("-");return d+"."+m+"."+y;};
const t12=s=>{if(!s)return "";let [h,m]=s.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return pad(h)+":"+pad(m)+" "+ap;};
const up=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const TYPES=["Truck","Trailer","Pickup","Car","Bus","Van","Crane","Forklift","Loader","Equipment"];
const BRANDS=["Mercedes Actros","Mercedes","Isuzu","Toyota","Toyota Hilux","Mitsubishi","Hyundai","Nissan","Volvo","MAN","Hino","Caterpillar","JCB"];
const COLOURS=["White","Yellow","Blue","Red","Silver","Grey","Black","Green","Orange"];
const REMARKS=["Vehicle in good condition","Full fuel tank","Tools complete","Spare tyre OK","Jack given","Istimara handed over","Keys handed over","Driving licence checked","Body scratches noted","Fire extinguisher OK"];

/* storage */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
let records=lsGet("vi:issued",[]); if(!Array.isArray(records))records=[];
let settings=lsGet("vi:settings",{issuedBy:lsGet("vr:settings",{}).issuedBy||""})||{issuedBy:""};
function persist(){if(!lsSet("vi:issued",records))toast("Could not save on this device. Storage may be full or blocked.");}

/* known vehicles: own history + daily report app (same site) */
function knownVehicles(){
  const map={};
  try{
    const dr=lsGet("wr:meta/vehicles",null); const list=dr&&dr.list||{};
    Object.keys(list).forEach(p=>{const v=list[p]||{};map[up(p)]={door:v.door||"",brand:v.vehicle||"",src:"daily report"};});
  }catch(e){}
  try{(lsGet("vr:returns",[])||[]).slice().sort((a,b)=>(a.savedAt||0)-(b.savedAt||0)).forEach(r=>{if(r&&r.plate)map[r.plate]={door:r.door,type:r.type,brand:r.brand,colour:r.colour,src:"vehicle return"};});}catch(e){}
  [...records].sort((a,b)=>(a.savedAt||0)-(b.savedAt||0)).forEach(r=>{
    if(!r.plate)return;
    map[r.plate]={door:r.door,type:r.type,brand:r.brand,colour:r.colour,src:"last issue"};
  });
  return map;
}
function knownDrivers(){
  const byCode={},byName={};
  try{(lsGet("vr:returns",[])||[]).forEach(r=>{if(r&&r.driver){byName[up(r.driver)]=byName[up(r.driver)]||{driver:r.driver};}});}catch(e){}
  [...records].sort((a,b)=>(a.savedAt||0)-(b.savedAt||0)).forEach(r=>{
    const d={em:r.em,driver:r.driver,mobile:r.mobile,site:r.site};
    if(r.em)byCode[up(r.em)]=d; if(r.driver)byName[up(r.driver)]=d;
  });
  return {byCode,byName};
}
let drivers=knownDrivers();
let vehicles=knownVehicles();

const state={editingId:null,remSel:new Set()};

/* lists */
function uniq(arr){return [...new Set(arr.filter(Boolean).map(s=>String(s).trim()).filter(Boolean))];}
function fill(id,arr){$(id).innerHTML=uniq(arr).map(v=>`<option value="${esc(v)}">`).join("");}
function refreshLists(){
  vehicles=knownVehicles(); drivers=knownDrivers();
  fill("plateList",Object.keys(vehicles));
  fill("empList",Object.keys(drivers.byCode));
  fill("typeList",TYPES.concat(records.map(r=>r.type)));
  fill("brandList",BRANDS.concat(records.map(r=>r.brand),Object.values(vehicles).map(v=>v.brand)));
  fill("colourList",COLOURS.concat(records.map(r=>r.colour)));
  fill("driverList",records.map(r=>r.driver).concat((lsGet("vr:returns",[])||[]).map(r=>r&&r.driver)));
  fill("siteList",records.map(r=>r.site));
  fill("recvList",records.map(r=>r.receivedBy));
  $("histCount").textContent=records.length?"("+records.length+")":"";
}

/* issue number */
function nextNo(){
  let max=0; records.forEach(r=>{const m=String(r.issueNo||"").match(/(\d+)\s*$/);if(m)max=Math.max(max,+m[1]);});
  return "VI-"+String(max+1).padStart(4,"0");
}

/* chips */
function renderTypeChips(){const cur=$("type").value.trim().toLowerCase();$("typeChips").innerHTML=TYPES.map(t=>`<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${cur===t.toLowerCase()}">${esc(t)}</button>`).join("");}
$("typeChips").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;$("type").value=$("type").value===b.dataset.t?"":b.dataset.t;renderTypeChips();preview();});
$("type").addEventListener("input",renderTypeChips);
function renderRemChips(){const txt=$("remarks").value.toLowerCase();$("remChips").innerHTML=REMARKS.map(r=>`<button type="button" class="chip" data-r="${esc(r)}" aria-pressed="${txt.includes(r.toLowerCase())}">${esc(r)}</button>`).join("");}
$("remChips").addEventListener("click",e=>{
  const b=e.target.closest("[data-r]");if(!b)return;const r=b.dataset.r;let v=$("remarks").value;
  if(v.toLowerCase().includes(r.toLowerCase())){v=v.split(/\n/).filter(l=>l.trim().toLowerCase()!==r.toLowerCase()).join("\n");}
  else v=(v.trim()?v.replace(/\s+$/,"")+"\n":"")+r;
  $("remarks").value=v;renderRemChips();preview();
});
$("remarks").addEventListener("input",renderRemChips);

/* plate autofill */
$("plate").addEventListener("input",()=>{
  const el=$("plate");const pos=el.selectionStart;el.value=el.value.toUpperCase();try{el.setSelectionRange(pos,pos);}catch(e){}
  const p=up(el.value), v=vehicles[p], h=$("plateHint"); h.textContent="";h.classList.remove("warn");
  if(v&&!state.editingId){
    const put=(id,val)=>{if(val&&!$(id).value)$(id).value=val;};
    put("door",v.door);put("type",v.type);put("brand",v.brand);put("colour",v.colour);
    renderTypeChips();
    h.textContent="Known vehicle — details filled from "+v.src+". Check and change if needed.";
  }
  const open=records.filter(r=>r.plate===p&&r.id!==state.editingId).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0))[0];
  if(open&&p){
    const ret=(lsGet("vr:returns",[])||[]).filter(r=>r&&r.plate===p&&(r.savedAt||0)>(open.savedAt||0));
    if(!ret.length){h.classList.add("warn");h.textContent="Note: "+p+" was issued to "+(up(open.driver)||"someone")+" on "+dmy(open.hDate)+" ("+open.issueNo+") and no return is saved after that.";}
  }
  preview();
});
function fillDriver(d,src){
  if(!d)return;const put=(id,val)=>{if(val&&!$(id).value)$(id).value=val;};
  put("em",d.em);put("driver",d.driver);put("mobile",d.mobile);put("site",d.site);
  $("drvHint").textContent="Known driver — details filled from "+src+".";preview();
}
$("em").addEventListener("input",e=>{e.target.value=e.target.value.toUpperCase();$("drvHint").textContent="";if(!state.editingId)fillDriver(drivers.byCode[up(e.target.value)],"last issue");});
$("driver").addEventListener("change",e=>{if(!state.editingId)fillDriver(drivers.byName[up(e.target.value)],"last issue");});
$("mobile").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/[^\d+ ]/g,"");const v=e.target.value.replace(/\s/g,"");const h=$("mobHint");h.classList.remove("warn");h.textContent="";
  if(v&&!/^(05\d{8}|\+9665\d{8}|9665\d{8})$/.test(v)){h.classList.add("warn");h.textContent="Saudi mobile is 10 digits starting with 05 (e.g. 0558650012).";}
});
$("nowBtn").addEventListener("click",()=>{$("hDate").value=todayISO();$("hTime").value=nowHM();preview();});
$("issuedBy").addEventListener("input",()=>{settings.issuedBy=$("issuedBy").value.trim();lsSet("vi:settings",settings);});
$("issueNo").addEventListener("input",()=>{const n=up($("issueNo").value);const dup=records.find(r=>up(r.issueNo)===n&&r.id!==state.editingId);$("formErr").textContent=dup?"Issue no. "+n+" is already used ("+dup.plate+").":"";});
$("f").addEventListener("input",preview);
$("f").addEventListener("submit",e=>{e.preventDefault();});

/* read / write form */
const FIELDS=["issueNo","plate","door","em","type","brand","colour","driver","site","mobile","hDate","hTime","remarks","issuedBy","receivedBy"];
function readForm(){
  const r={};FIELDS.forEach(k=>r[k]=$(k).value.trim());
  ["issueNo","plate","door","em"].forEach(k=>r[k]=up(r[k]));
  r.mobile=r.mobile.replace(/\s+/g,"");return r;
}
function writeForm(r){FIELDS.forEach(k=>$(k).value=r[k]||"");renderTypeChips();renderRemChips();preview();}
function newForm(){
  state.editingId=null;
  writeForm({issueNo:nextNo(),hDate:todayISO(),hTime:nowHM(),issuedBy:settings.issuedBy||""});
  $("formTitle").textContent="New vehicle issue";$("plateHint").textContent="";$("drvHint").textContent="";$("mobHint").textContent="";$("formErr").textContent="";
}

/* preview */
function preview(){
  const r=readForm();
  $("noBadge").textContent=r.issueNo||"—";
  $("pNo").textContent="NO: "+(r.issueNo||"—")+"   DATE: "+(dmy(r.hDate)||"—");
  const cells=[["PLATE NO",r.plate],["DOOR NO",r.door],["EMP CODE NO",r.em],["TYPE",up(r.type)],["BRAND",up(r.brand)],["COLOUR",up(r.colour)],["DRIVER",up(r.driver)],["SITE",up(r.site)],["MOBILE NO",r.mobile],["ISSUE NO",r.issueNo],["ISSUE DATE",dmy(r.hDate)],["ISSUE TIME",t12(r.hTime)]];
  $("pGrid").innerHTML=cells.map(([l,v])=>`<div class="pc"><i>${l}</i><em>${esc(v)}</em></div>`).join("");
  $("pRem").textContent=r.remarks;
  $("pIss").textContent=up(r.issuedBy);$("pRec").textContent=up(r.receivedBy);
  $("prevDate").textContent=r.plate||"";
}

/* save */
function validate(r){
  if(!r.plate){$("formErr").textContent="Enter the plate number.";$("plate").focus();return false;}
  if(!r.issueNo){$("formErr").textContent="Enter the issue number.";$("issueNo").focus();return false;}
  if(!r.driver&&!r.em){$("formErr").textContent="Enter the driver name or emp code.";$("driver").focus();return false;}
  if(!r.hDate){$("formErr").textContent="Choose the issue date.";$("hDate").focus();return false;}
  $("formErr").textContent="";return true;
}
function save(){
  const r=readForm(); if(!validate(r))return null;
  let rec;
  if(state.editingId){rec={...records.find(x=>x.id===state.editingId),...r,savedAt:Date.now()};records=records.map(x=>x.id===rec.id?rec:x);}
  else{rec={id:uid(),...r,savedAt:Date.now()};records=[...records,rec];state.editingId=rec.id;}
  persist();refreshLists();renderHist();
  $("formTitle").textContent="Editing "+rec.issueNo;
  return rec;
}
$("saveBtn").addEventListener("click",()=>{const rec=save();if(rec)toast(rec.issueNo+" saved","New form",newForm);});
$("newBtn").addEventListener("click",()=>{newForm();showTab("new");window.scrollTo({top:0,behavior:"smooth"});$("plate").focus();});
$("pdfBtn").addEventListener("click",async()=>{
  const rec=save();if(!rec)return;
  const b=$("pdfBtn");b.disabled=true;
  try{await makePdf(rec);}finally{b.disabled=false;}
});

/* PDF */
async function makePdf(r){
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const W=210,M=10,navy=[19,33,75],gold=[232,163,23],cream=[243,226,174],grid=[189,189,189];
    try{doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:0.08}));doc.addImage(WM,"PNG",(W-120)/2,98,120,122);doc.restoreGraphicsState();}catch(e){}
    const lhH=(W-2*M)*197/1186; doc.addImage(LH,"JPEG",M,6,W-2*M,lhH);
    let y=6+lhH+4;
    doc.setFillColor(...navy);doc.roundedRect(M,y,W-2*M,13,2,2,"F");
    doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);doc.setFontSize(15);doc.text("VEHICLE ISSUED",M+5,y+8.7);
    doc.setTextColor(...gold);doc.setFontSize(10.5);doc.text("NO: "+r.issueNo+"     DATE: "+dmy(r.hDate),W-M-5,y+8.5,{align:"right"});
    y+=19;
    const cells=[["PLATE NO",r.plate],["DOOR NO",r.door],["EMP CODE NO",r.em],["TYPE",up(r.type)],["BRAND",up(r.brand)],["COLOUR",up(r.colour)],["DRIVER",up(r.driver)],["SITE",up(r.site)],["MOBILE NO",r.mobile],["ISSUE NO",r.issueNo],["ISSUE DATE",dmy(r.hDate)],["ISSUE TIME",t12(r.hTime)]];
    const cw=(W-2*M)/2, ch=17;
    doc.setDrawColor(...grid);doc.setLineWidth(0.25);
    cells.forEach(([l,v],i)=>{
      const x=M+(i%2)*cw, yy=y+Math.floor(i/2)*ch;
      doc.setFillColor(...cream);doc.rect(x,yy,cw,6,"F");doc.rect(x,yy,cw,ch);
      doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...navy);doc.text(l,x+3,yy+4.2);
      doc.setFontSize(12);doc.setTextColor(22,33,62);
      const t=doc.splitTextToSize(String(v||""),cw-6);doc.text(t.slice(0,1),x+3,yy+12.6);
    });
    y+=Math.ceil(cells.length/2)*ch+4;
    const rh=52;
    doc.setFillColor(...cream);doc.rect(M,y,W-2*M,6,"F");doc.rect(M,y,W-2*M,rh);
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...navy);doc.text("REMARKS",M+3,y+4.2);
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(22,33,62);
    const lines=doc.splitTextToSize(r.remarks||"",W-2*M-6).slice(0,9);doc.text(lines,M+3,y+11.5,{lineHeightFactor:1.35});
    const sy=262;
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(22,33,62);
    if(r.issuedBy)doc.text(up(r.issuedBy),M+35,sy-3,{align:"center"});
    if(r.receivedBy)doc.text(up(r.receivedBy),W-M-35,sy-3,{align:"center"});
    doc.setDrawColor(110,110,110);doc.setLineWidth(0.3);doc.line(M+5,sy,M+65,sy);doc.line(W-M-65,sy,W-M-5,sy);
    doc.setFontSize(9.5);doc.setTextColor(...navy);doc.text("ISSUED BY",M+35,sy+5,{align:"center"});doc.text("RECEIVED BY",W-M-35,sy+5,{align:"center"});
    doc.setDrawColor(226,226,226);doc.line(M,284,W-M,284);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(130,130,130);
    doc.text("Al-Zoman Contracting Co. — Vehicle Issued "+r.issueNo,M,289);doc.text("Page 1 of 1",W-M,289,{align:"right"});
    const name="Vehicle_Issued_"+r.issueNo+"_"+r.plate.replace(/\s+/g,"")+".pdf";
    await saveFile(name,doc.output("blob"));
  }catch(err){console.error(err);toast("Could not make the PDF ("+(err&&err.message||"error")+").");}
}
async function saveFile(fname,blob){
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");await dl.save({filename:fname,data:blob});toast("PDF saved");return;}
  }catch(e){if(e&&e.code==="declined"){toast("Download cancelled");return;}}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast("PDF downloaded","New form",newForm);
}

/* history */
function renderHist(){
  const q=$("hq").value.trim().toLowerCase();
  const list=[...records].sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)).filter(r=>!q||[r.issueNo,r.plate,r.driver,r.em,r.mobile,r.site,r.door,r.brand].join(" ").toLowerCase().includes(q));
  if(!records.length){$("hist").innerHTML=`<div class="empty"><h3>No vehicles issued yet</h3><p>Fill the form and press “Save &amp; PDF”. Every issued vehicle shows here.</p></div>`;return;}
  if(!list.length){$("hist").innerHTML=`<div class="empty"><h3>Nothing matches</h3><p>Try another plate or name.</p></div>`;return;}
  const pdfI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
  const edI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const delI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
  $("hist").innerHTML=`<div class="hrow hh"><span>Issue no.</span><span>Plate</span><span>Driver</span><span>Site</span><span>Issued on</span><span></span></div>`+
    list.map(r=>`<div class="hrow" data-id="${esc(r.id)}">
      <span class="no">${esc(r.issueNo)}</span>
      <span class="pl">${esc(r.plate)}<small>${esc([r.door,r.brand].filter(Boolean).join(" · "))}</small></span>
      <span class="dr">${esc(up(r.driver))||"–"}${r.em||r.mobile?`<small>${esc([r.em,r.mobile].filter(Boolean).join(" · "))}</small>`:""}</span>
      <span class="st">${esc(up(r.site))||"–"}</span>
      <span class="dt">${esc(dmy(r.hDate))} ${esc(t12(r.hTime))}</span>
      <span class="acts"><button type="button" class="icon" data-a="pdf" aria-label="Download PDF ${esc(r.issueNo)}">${pdfI}<span class="t">PDF</span></button><button type="button" class="icon" data-a="edit" aria-label="Open ${esc(r.issueNo)}">${edI}</button><button type="button" class="icon del" data-a="del" aria-label="Delete ${esc(r.issueNo)}">${delI}</button></span>
    </div>`).join("");
}
$("hq").addEventListener("input",renderHist);
$("hist").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const id=b.closest(".hrow").dataset.id;const r=records.find(x=>x.id===id);if(!r)return;
  if(b.dataset.a==="pdf")makePdf(r);
  else if(b.dataset.a==="edit"){state.editingId=id;writeForm(r);$("formTitle").textContent="Editing "+r.issueNo;$("plateHint").textContent="";$("drvHint").textContent="";$("mobHint").textContent="";showTab("new");window.scrollTo({top:0,behavior:"smooth"});}
  else if(b.dataset.a==="del"){
    const idx=records.indexOf(r);records=records.filter(x=>x.id!==id);persist();refreshLists();renderHist();
    if(state.editingId===id)newForm();
    toast(r.issueNo+" deleted","Undo",()=>{const a=[...records];a.splice(Math.min(idx,a.length),0,r);records=a;persist();refreshLists();renderHist();});
  }
});

/* tabs */
function showTab(t){
  const n=t==="new";$("viewNew").hidden=!n;$("viewHist").hidden=n;
  $("tabNew").setAttribute("aria-selected",String(n));$("tabHist").setAttribute("aria-selected",String(!n));
  document.querySelector(".actionbar").hidden=!n;
  if(!n)renderHist();
}
$("tabNew").addEventListener("click",()=>showTab("new"));
$("tabHist").addEventListener("click",()=>showTab("hist"));

/* toast */
let tt=null;
function toast(msg,label,fn){
  $("toastMsg").textContent=msg;const a=$("toastAct");
  if(label){a.hidden=false;a.textContent=label;a.onclick=()=>{fn();$("toast").classList.remove("show");};}else{a.hidden=true;a.onclick=null;}
  $("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),label?6000:2600);
}

/* start */
renderTypeChips();renderRemChips();refreshLists();newForm();renderHist();
window.addEventListener("storage",e=>{if(e.key==="vi:issued"){records=lsGet("vi:issued",[]);refreshLists();renderHist();}});
})();
</script>
</body>
